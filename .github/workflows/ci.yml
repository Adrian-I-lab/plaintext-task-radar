name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Core line budget
        run: python tools/check_core_size.py
      - name: Lint the demo vault (it holds planted errors, so exit 1 is expected)
        run: |
          set +e
          taskradar lint examples/demo-vault
          status=$?
          set -e
          test "$status" -eq 1
      - name: Radar output matches the golden file
        run: taskradar radar examples/demo-vault --today 2026-10-14 | diff - tests/golden/demo-radar.txt
